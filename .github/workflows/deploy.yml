name: Build & Deploy

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cafebackend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 배포 대상 결정
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.target.outputs.target }}-latest

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/ubuntu/CafeBackend
            if [ "${{ steps.target.outputs.target }}" = "prod" ]; then
              DEPLOY_IMAGE="${{ env.IMAGE }}:${{ github.sha }}" ./deploy-prod.sh
            else
              DEPLOY_IMAGE="${{ env.IMAGE }}:${{ github.sha }}" ./deploy-dev.sh
            fi
